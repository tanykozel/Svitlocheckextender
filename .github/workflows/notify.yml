name: Outage alerts

on:
  schedule:
    - cron: "*/10 * * * *" # GitHub may delay scheduled runs; see README "Where to run it"
  workflow_dispatch:

concurrency:
  group: outage-alerts
  cancel-in-progress: false

jobs:
  check:
    # Stays idle until the queue is configured (Settings -> Secrets and variables -> Actions -> Variables).
    if: vars.SVITLO_QUEUE != '' && vars.SVITLO_SUBQUEUE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore sent-alerts state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: svitlo-state-${{ github.run_id }}
          restore-keys: svitlo-state-
      - name: Send due alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SVITLO_QUEUE: ${{ vars.SVITLO_QUEUE }}
          SVITLO_SUBQUEUE: ${{ vars.SVITLO_SUBQUEUE }}
          SVITLO_LABEL: ${{ vars.SVITLO_LABEL }}
          SVITLO_LEAD_MINUTES: ${{ vars.SVITLO_LEAD_MINUTES }}
        run: python -m svitlo_notifier check
      - name: Save sent-alerts state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: svitlo-state-${{ github.run_id }}
